<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wepa · tu guía de Panamá</title>
<meta name="theme-color" content="#0b4fa8">
<script>document.write('<script src="config.js?v=' + Date.now() + '"><\/script>')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Bus « diablo rojo » + mola guna : couleurs peintes, contours noirs, bordures en couches */
  :root {
    --c: #0b4fa8;          /* bleu du drapeau panaméen (ou la couleur de l'hôtel) */
    --red: #d21034;        /* rouge du drapeau */
    --mango: #5db4ff;      /* bleu ciel : boutons, cadres, sélection */
    --ink: #0f1b2d;        /* bleu nuit des contours */
    --sea: #f0f6fd;        /* fond du chat : blanc bleuté */
    --muted: #4b5a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 16px/1.5 Figtree, system-ui, sans-serif; color: var(--ink); background: var(--sea); height: 100dvh; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100dvh; background: var(--sea); position: relative; }
  #bg { display: none; }
  /* sur ordinateur : le Panama en plein écran derrière, le chat au milieu dans son cadre mola */
  @media (min-width: 860px) {
    body { background: var(--ink); }
    #bg { display: block; position: fixed; inset: 0; overflow: hidden; }
    #bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.6s; }
    #bg img.on { opacity: .9; animation: drift 14s ease-out forwards; }
    #bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(20,20,20,0) 30%, rgba(20,20,20,.55)); }
    .app { width: 540px; height: calc(100dvh - 56px); margin: 28px auto; border-radius: 26px; overflow: hidden;
           box-shadow: 0 0 0 4px var(--ink), 0 0 0 10px var(--mango), 0 0 0 14px var(--ink), 0 0 0 20px var(--red), 0 30px 60px rgba(0,0,0,.5); }
    .window, body.chatting .window { box-shadow: 0 0 0 3px var(--ink), 0 0 0 7px var(--mango), 0 0 0 10px var(--ink); margin-left: 16px; margin-right: 16px; }
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--mango); outline-offset: 2px; }

  /* ---------- bandeau ---------- */
  header { background: var(--c); color: #fff; flex: none; position: relative; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 14px 10px; }
  .av { position: relative; width: 52px; height: 52px; flex: none; }
  .av .ring { position: absolute; inset: 0; border-radius: 50%;
              background: conic-gradient(var(--red) 0 25%, var(--mango) 0 50%, var(--ink) 0 75%, #fff 0);
              animation: spin 14s linear infinite; }
  .av .pic { position: absolute; inset: 4px; border-radius: 50%; overflow: hidden; background: var(--ink);
             display: grid; place-items: center; font: 18px Bungee, sans-serif; color: var(--mango); }
  .av .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s; }
  .av .pic img.on { opacity: 1; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .who { min-width: 0; }
  .name { font: 24px/1 Bungee, sans-serif; letter-spacing: .5px; text-shadow: 2px 2px 0 var(--ink);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13px; font-weight: 600; opacity: .95; margin-top: 3px; }
  /* le W de Wepa : une vague (mangue, ombre noire), qui ondule doucement */
  .name .wv { width: 36px; height: 24px; vertical-align: -3px; margin-right: 1px; overflow: visible; }
  .wv path { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .wv path.sh { stroke: var(--red); transform: translate(2px, 2px); }
  .name .wv { animation: surf 4s ease-in-out infinite; transform-origin: 50% 60%; }
  @keyframes surf { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(-4deg); } }
  /* « epa » suit la vague : chaque lettre monte et descend, avec un temps de retard sur la précédente */
  .name .fl i { font-style: normal; display: inline-block; animation: swell 4s ease-in-out infinite; }
  .name .fl i:nth-child(1) { animation-delay: .25s; } .name .fl i:nth-child(2) { animation-delay: .5s; } .name .fl i:nth-child(3) { animation-delay: .75s; }
  @keyframes swell { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(-5deg); } }
  @media (prefers-reduced-motion: reduce) { .name .wv, .name .fl i { animation: none; } }
  #langs { margin-left: auto; display: flex; gap: 4px; flex: none; }
  #langs button { border: 2px solid var(--ink); background: #fff; color: var(--ink); border-radius: 9px;
                  padding: 3px 7px; font-size: 12px; font-weight: 800; cursor: pointer; }
  #langs button.on { background: var(--mango); box-shadow: 2px 2px 0 var(--ink); }

  /* la fenêtre de photos, encadrée comme une mola (couches de tissu) */
  .window { position: relative; margin: 6px 22px 26px; height: min(34vh, 290px); border-radius: 22px; overflow: hidden;
            background: var(--ink); box-shadow: 0 0 0 4px var(--ink), 0 0 0 9px var(--mango), 0 0 0 13px var(--ink), 0 0 0 18px var(--red);
            transition: height .45s ease, margin .45s ease, box-shadow .45s; }
  .window img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
                transition: opacity 1.2s; transform: scale(1.04); }
  .window img.on { opacity: 1; animation: drift 9s ease-out forwards; }
  @keyframes drift { from { transform: scale(1.12); } to { transform: scale(1.02); } }
  .cap { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .cap span { background: rgba(20,20,20,.78); color: #fff; border-radius: 8px; padding: 3px 8px; font-size: 13px; font-weight: 600; max-width: 100%; }
  .cap a { color: #fff; opacity: .85; font-size: 10px; text-decoration: none; background: rgba(20,20,20,.6); border-radius: 6px; padding: 1px 6px; }
  .window .empty { position: absolute; inset: 0; display: grid; place-items: center; font: 40px Bungee, sans-serif; color: var(--mango); }
  body.chatting .window { height: 92px; margin: 2px 22px 24px; }
  body.chatting .cap span { display: none; }

  /* ---------- conversation ---------- */
  #chat > * { flex-shrink: 0; }          /* sinon les photos sont écrasées quand la conversation s'allonge */
  #chat { flex: 1; overflow-y: auto; padding: 18px 14px 10px; display: flex; flex-direction: column; gap: 12px; }
  .m { max-width: min(86%, 560px); padding: 10px 14px; border-radius: 18px; font-size: 15.5px; line-height: 1.5; overflow-wrap: anywhere; }
  .u { align-self: flex-end; background: var(--red); color: #fff; border-bottom-right-radius: 5px; font-weight: 600; }
  .b { align-self: flex-start; background: #fff; border: 2px solid var(--ink); border-bottom-left-radius: 5px; box-shadow: 3px 3px 0 var(--c); }
  .b a { color: var(--red); font-weight: 600; }
  .b ul { margin: 4px 0; padding-left: 20px; }
  .fb { align-self: flex-start; margin: -4px 0 0 8px; display: flex; gap: 4px; }
  .fb button { border: 0; background: none; font-size: 17px; cursor: pointer; opacity: .5; padding: 2px 4px; }
  .fb button:hover, .fb button.on { opacity: 1; transform: scale(1.15); }

  /* attente : un diablo rojo traverse la bulle, et une anecdote pour patienter */
  .wait { color: var(--muted); }
  .road { position: relative; height: 26px; border-bottom: 3px dashed var(--mango); margin: 0 0 8px; overflow: hidden; min-width: 210px; }
  .road i { position: absolute; bottom: -2px; font-size: 22px; font-style: normal; animation: drive 3.2s linear infinite; }
  @keyframes drive { from { left: 100%; } to { left: -30px; } }
  .fact { font-size: 14px; }
  .fact b { color: var(--ink); }
  .qpos { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .think i { font-style: normal; animation: blink 1.4s infinite both; }
  .think i:nth-child(2) { animation-delay: .2s; } .think i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .15; } 40% { opacity: 1; } }

  /* photos sous la réponse */
  .pics { align-self: flex-start; display: flex; gap: 10px; overflow-x: auto; max-width: 100%; padding: 2px 2px 6px; }
  .pics button { flex: none; width: 190px; padding: 0; border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; background: #fff; cursor: zoom-in; text-align: left; }
  .pics img { display: block; width: 100%; height: 130px; object-fit: cover; }
  .pics span { display: block; font-size: 12px; font-weight: 600; padding: 5px 8px 6px; line-height: 1.3; }

  dialog { border: 3px solid var(--ink); border-radius: 18px; padding: 0; max-width: min(94vw, 760px); box-shadow: 6px 6px 0 var(--mango); }
  dialog::backdrop { background: rgba(20,20,20,.7); }
  dialog img { display: block; width: 100%; max-height: 70vh; object-fit: contain; background: var(--ink); }
  dialog p { margin: 10px 14px 4px; font-weight: 600; }
  dialog a { display: block; margin: 0 14px 12px; font-size: 12px; color: var(--muted); }
  dialog form { position: absolute; top: 8px; right: 8px; margin: 0; }
  dialog form button { border: 2px solid var(--ink); background: #fff; border-radius: 50%; width: 36px; height: 36px; font-weight: 800; cursor: pointer; }


  /* contacts WhatsApp : bouton flottant + panneau */
  #waBtn { position: absolute; right: 14px; bottom: 164px; z-index: 5; display: flex; align-items: center; gap: 7px;
           background: var(--mango); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 9px 15px 9px 12px;
           font: 800 14px Figtree, sans-serif; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
  #waBtn .cmp { font-size: 19px; display: inline-block; animation: spin 7s ease-in-out infinite; }
  @keyframes spin { 0%, 80% { transform: rotate(0); } 88% { transform: rotate(-25deg); } 96% { transform: rotate(15deg); } 100% { transform: rotate(0); } }
  @media (prefers-reduced-motion: reduce) { #waBtn .cmp { animation: none; } }
  body.chatting #waBtn { bottom: 108px; }
  body.chatting #chat { padding-bottom: 64px; }
  #waBtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  #dir { width: min(96vw, 560px); background: var(--sea); }
  #dir .head { padding: 18px 56px 6px 16px; }
  #dir h3 { margin: 0; font: 26px/1.05 Bungee, sans-serif; text-shadow: 2px 2px 0 var(--mango); }
  #dir .note { font-size: 11px; color: var(--muted); padding: 0 16px 10px; }
  #dir .cats { display: flex; gap: 10px; overflow-x: auto; padding: 10px 16px 12px; scrollbar-width: none; }
  #dir .cats button { flex: none; width: 76px; height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 2px solid var(--ink); border-radius: 18px; background: var(--tile, #fff); cursor: pointer; font: 700 11px/1.1 Figtree, sans-serif;
    box-shadow: 3px 3px 0 var(--ink); transition: transform .12s; text-align: center; padding: 4px; }
  #dir .cats button span { font-size: 28px; line-height: 1; }
  #dir .cats button.on { transform: translate(-2px, -3px) rotate(-3deg); box-shadow: 5px 6px 0 var(--ink); outline: 3px solid #fff; }
  #dir .tools { display: flex; gap: 8px; margin: 0 16px 10px; }
  #dir .search { flex: 1; min-width: 0; border: 2px solid var(--ink); border-radius: 999px; padding: 8px 14px; font: 15px Figtree, sans-serif; background: #fff; }
  #dir .luck { flex: none; border: 2px solid var(--ink); border-radius: 999px; background: #fff; padding: 0 12px; font: 800 13px Figtree, sans-serif; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  #dir .list { max-height: 56vh; overflow-y: auto; padding: 2px 16px 16px; display: grid; gap: 10px; }
  .crow { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; background: #fff; border: 2px solid var(--ink); border-radius: 16px;
    box-shadow: 3px 3px 0 var(--tile, var(--mango)); }
  .crow.pick { animation: pick .9s ease; }
  @keyframes pick { 30% { transform: scale(1.04) rotate(-1deg); box-shadow: 6px 6px 0 var(--ink); } }
  @media (prefers-reduced-motion: reduce) { .crow.pick { animation: none; } }
  .crow .ic { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--ink); background: var(--tile, var(--mango));
    display: grid; place-items: center; font-size: 23px; }
  .crow .tx { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.35; }
  .crow .tx b { display: block; font-size: 15px; }
  .crow .tx small { color: var(--muted); display: block; }
  .crow .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .crow .chips i { font-style: normal; font-size: 11px; font-weight: 700; border: 1.5px solid var(--ink); border-radius: 999px; padding: 0 7px; background: var(--sea); }
  .crow .tag { font-size: 10px; font-weight: 800; border: 1.5px solid var(--ink); border-radius: 6px; padding: 0 4px; background: var(--mango); margin-left: 4px; }
  .crow a.go { flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 54px; padding: 6px 6px 4px; border-radius: 14px;
    background: #25d366; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); color: var(--ink); text-decoration: none; font: 800 10.5px Figtree, sans-serif; }
  .crow a.go svg { width: 22px; height: 22px; }
  .crow a.go .e { font-size: 20px; line-height: 22px; }
  .crow a.go:active { transform: translate(2px, 2px); box-shadow: none; }
  .crow a.go.web, .crow a.go.map { background: #fff; }
  #dir .none { color: var(--muted); font-size: 15px; padding: 24px 0; text-align: center; }
  /* sous une recommandation : un bouton par adresse ; sous une réponse : un lien vers les contacts du sujet */
  .recos { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 6px; max-width: 92%; }
  .recos a, .recos button { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--ink); border-radius: 999px;
    padding: 6px 12px; background: #fff; color: var(--ink); font: 700 13px Figtree, sans-serif; text-decoration: none; cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink); }
  .recos a.wa { background: #25d366; }
  /* proposer une adresse : sous la liste du répertoire */
  [hidden] { display: none !important; }
  #dir .propose { padding: 0 16px 16px; }
  #propBtn { width: 100%; border: 2px dashed var(--ink); background: #fff; border-radius: 12px; padding: 10px; font: 700 14px Figtree, sans-serif; cursor: pointer; }
  #propBox { padding: 0 16px 16px; max-height: 64vh; overflow-y: auto; }
  #propBox label { display: block; font-size: 13px; font-weight: 700; margin-top: 10px; }
  #propBox input, #propBox select { width: 100%; margin-top: 4px; border: 2px solid var(--ink); border-radius: 10px; padding: 8px 10px; font: 15px Figtree, sans-serif; background: #fff; }
  #propBox .who { display: flex; gap: 8px; margin-top: 6px; }
  #propBox .who label { flex: 1; margin: 0; border: 2px solid var(--ink); border-radius: 10px; padding: 8px; font-weight: 600; cursor: pointer; }
  #propBox .who input { width: auto; margin: 0 6px 0 0; }
  #propBox .hp { position: absolute; left: -9999px; }
  #propBox .small { font-size: 12px; color: var(--muted); margin-top: 8px; }
  #propBox .send { width: 100%; margin-top: 12px; border: 2px solid var(--ink); background: var(--mango); border-radius: 12px; padding: 10px; font: 800 15px Figtree, sans-serif; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
  #propBox .msg { margin-top: 10px; font-weight: 700; }
  .recos a svg { width: 16px; height: 16px; }
  .recos a:active, .recos button:active { transform: translate(2px, 2px); box-shadow: none; }

  /* suggestions : des autocollants */
  #chips { display: flex; gap: 10px; overflow-x: auto; padding: 4px 14px 12px; flex: none; }
  #chips button { flex: none; border: 2px solid var(--ink); background: #fff; border-radius: 999px; padding: 8px 14px;
                  font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 var(--mango); }
  #chips button:nth-child(2) { box-shadow: 3px 3px 0 var(--c); }
  #chips button:nth-child(3) { box-shadow: 3px 3px 0 var(--red); }
  #chips button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  form#f { display: flex; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 2px solid var(--ink); flex: none; }
  #q { flex: 1; min-width: 0; border: 2px solid var(--ink); border-radius: 999px; padding: 11px 16px; font: 16px Figtree, sans-serif; outline: none; }
  #q:focus { box-shadow: 3px 3px 0 var(--c); }
  #send { flex: none; border: 2px solid var(--ink); background: var(--mango); width: 48px; height: 48px; border-radius: 50%;
          font-size: 20px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  #send:disabled { opacity: .45; }
  footer { text-align: center; font-size: 11px; color: var(--muted); padding: 0 14px 8px; background: #fff; flex: none; }

  @media (prefers-reduced-motion: reduce) {
    .av .ring, .road i, .window img.on { animation: none; }
    .window, .window img, .av .pic img { transition: none; }
  }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div class="app">
<header>
  <div class="bar">
    <div class="av" aria-hidden="true"><div class="ring"></div><div class="pic" id="avpic"><svg class="wv" style="width:30px;height:22px" viewBox="0 0 46 30" aria-hidden="true"><path class="sh" d="M3 5 C7 5 7 26 12 26 C17 26 17 11 23 11 C29 11 29 26 34 26 C39 26 39 5 43 5"/><path d="M3 5 C7 5 7 26 12 26 C17 26 17 11 23 11 C29 11 29 26 34 26 C39 26 39 5 43 5"/></svg></div></div>
    <div class="who"><div class="name" id="name" aria-label="Wepa"><svg class="wv" viewBox="0 0 46 30" aria-hidden="true"><path class="sh" d="M3 5 C7 5 7 26 12 26 C17 26 17 11 23 11 C29 11 29 26 34 26 C39 26 39 5 43 5"/><path d="M3 5 C7 5 7 26 12 26 C17 26 17 11 23 11 C29 11 29 26 34 26 C39 26 39 5 43 5"/></svg><span class="fl"><i>e</i><i>p</i><i>a</i></span></div><div class="sub" id="sub"></div></div>
    <div id="langs"><button data-l="es">ES</button><button data-l="en">EN</button><button data-l="fr">FR</button></div>
  </div>
  <figure class="window" id="win" aria-live="off"><div class="empty">¡WEPA!</div><figcaption class="cap" id="cap"></figcaption></figure>
</header>
<div id="chat" aria-live="polite"></div>
<div id="chips"></div>
<form id="f">
  <input id="q" autocomplete="off" maxlength="500" aria-label="question">
  <button id="send" aria-label="send">➤</button>
</form>
<footer id="foot"></footer>
<template id="waSvg"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#0b3d1f" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3.9 2.5c.1.2 1.6 2.5 4 3.5 1.5.6 2.1.7 2.8.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg></template><button id="waBtn" type="button"><span class="cmp" aria-hidden="true">🧭</span><span id="waLab">Explorar</span></button>
</div>
<dialog id="dir"><form method="dialog"><button aria-label="close">✕</button></form><div class="head"><h3 id="dirT"></h3></div><div class="cats" id="dirC"></div><div class="tools"><input class="search" id="dirQ" autocomplete="off"><button type="button" class="luck" id="dirLuck"></button></div><div class="list" id="dirList"></div><div class="note" id="dirN"></div><div class="propose"><button type="button" id="propBtn"></button></div><div id="propBox" hidden></div></dialog>

<script>
const API = (window.MIPTY_API || "").replace(/\/$/, "");
const HOTEL = new URLSearchParams(location.search).get("h") || null;
let saved = ""; try { saved = localStorage.getItem("mipty_lang") || ""; } catch (e) {}
const L = saved || (navigator.language || "es").slice(0, 2);
let lang = ["es", "en", "fr"].includes(L) ? L : "en";
let T, HOTEL_INFO = null, started = false;
const ALL = {
  es: {sub: "Tu guía de Panamá, 24 h", ph: "Pregunta lo que quieras…", queue: n => `Hay ${n} pregunta(s) antes de la tuya`,
       know: "¿Sabías que…", slow: "Pensando",
       foot: "Asistente automático de Neuralytic. La información es indicativa: confirma precios y horarios con el hotel.",
       hello: "¡Qué xopá! Soy Wepa. Pregúntame sobre transporte, San Blas, Bocas, Boquete, presupuesto o seguridad en Panamá.",
       chips: ["✈️ ¿Cómo llego del aeropuerto?", "🏝️ ¿Cómo ir a San Blas?", "🌙 ¿Es seguro Casco Viejo de noche?"], err: "No pude conectarme. Revisa tu conexión y vuelve a intentarlo.",
       facts: ["En Panamá se paga en dólares; el balboa solo existe en monedas.",
               "Desde la cima del volcán Barú (3 475 m), en días claros se ven el Pacífico y el Caribe.",

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function md(s) {   // petit rendu : gras, italique, liens, listes
  const lines = esc(s).split("\n"); let out = "", inList = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\s)_(.+?)_(?=\s|$)/g, "$1<i>$2</i>")
         .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
         .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    if (/^\s*[-•]\s+/.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + l.replace(/^\s*[-•]\s+/, "") + "</li>"; }
    else { if (inList) { out += "</ul>"; inList = false; } out += l + "<br>"; }
  }
  return (out + (inList ? "</ul>" : "")).replace(/(<br>)+$/, "");
}

async function ask(text) {
  text = text.trim(); if (!text) return;
  started = true; document.body.classList.add("chatting");
  $("chips").style.display = "none"; $("q").value = ""; $("send").disabled = true;
  bubble("u", esc(text));
  const w = bubble("b wait", waitHTML());
  const factTimer = setInterval(() => { factIdx++; const q = w.querySelector(".qpos:not(.think)"); w.innerHTML = waitHTML(q && q.textContent); }, 9000);
  try {
    const r = await fetch(API + "/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: text, session, hotel: HOTEL, lang})});
    const d = await r.json();
    if (!r.ok) { clearInterval(factTimer); w.className = "m b"; w.innerHTML = esc(d.message || T.err); $("send").disabled = false; return; }
    let first = true;
    while (true) {
      await new Promise(res => setTimeout(res, first ? 700 : 2000)); first = false;   // une réponse en mémoire arrive tout de suite
      const j = await (await fetch(API + "/api/job/" + d.job)).json();
      if (j.status === "done" || j.status === "error") {
        clearInterval(factTimer); factIdx++;
        w.className = "m b"; w.innerHTML = md(j.answer); photoRow(j.photos);
        if (j.reco) recoRow(j.contacts); else dirChip(j.contacts);
        feedbackRow(j.qa_id); break;
      }
      if (j.status === "queued" && j.position > 1) { const q = w.querySelector(".qpos"); if (q) { q.className = "qpos"; q.textContent = T.queue(j.position - 1); } }
      else if (j.partial) { clearInterval(factTimer); w.className = "m b"; w.innerHTML = md(j.partial); }
      scrollEnd();
    }
  } catch (e) { clearInterval(factTimer); w.className = "m b"; w.textContent = T.err; }
  $("send").disabled = false; $("q").focus();
}

  const img = new Image(); img.alt = alt || ""; img.decoding = "async";
  img.onload = () => {
    box.querySelectorAll("img").forEach(x => { x.classList.remove("on"); setTimeout(() => x.remove(), 1300); });
    [...box.childNodes].forEach(n => (n.nodeType === 3 || (n.classList && n.classList.contains("wv"))) && n.remove());          // les initiales cèdent la place aux photos
    box.insertBefore(img, box.querySelector("figcaption")); requestAnimationFrame(() => img.classList.add("on"));
  };
  img.src = src;
}
function step() {
  const p = show[showIdx % show.length]; showIdx++;
  swap($("win"), media(p.src), p.caption);
  $("cap").innerHTML = `<span>${esc(p.caption)}</span>` + (p.credit ? `<a href="${esc(p.page)}" target="_blank" rel="noopener">📷 ${esc(p.credit)}</a>` : "");
  if (getComputedStyle($("bg")).display !== "none") swap($("bg"), media(p.src), "");
  swap($("avpic"), media(p.src), "");
}

async function start() {
  if (HOTEL) {
    $("waBtn").style.display = "none";         // la page d'un hôtel : il vend ses propres excursions
    try {
      const h = await (await fetch(API + "/api/hotel/" + encodeURIComponent(HOTEL))).json();
      if (h.name) {
        document.title = h.name; $("name").textContent = h.name;
        $("avpic").textContent = h.name.split(/\s+/).filter(w => /^[A-Za-zÀ-ÿ]/.test(w) && !/^(hotel|hostal|the|el|la|los|las)$/i.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join("") || h.name[0];
        document.documentElement.style.setProperty("--c", h.color || "#0b4fa8");
        document.querySelector('meta[name="theme-color"]').content = h.color || "#0b4fa8";
        HOTEL_INFO = h;
        if (h.explore) $("waBtn").style.display = "";   // l'hôtel a choisi d'afficher Explorar (sans les autres hôtels)
      }
    } catch (e) { console.error("miPTY: API injoignable", API, e); }
  }
  if (!API || /TON-DOMAINE/.test(API)) console.error("miPTY: config.js n'a pas l'adresse du serveur", API);
  applyLang(lang);
}
start();
</script>
